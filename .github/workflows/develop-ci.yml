name: Build & Push Docker Image to GHCR (develop)

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '.github/**'

jobs:
  build:
#    runs-on: self-hosted
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/kteventee/eventee-member-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build and Push image to GHCR
      - name: Set image tag
        run: |
          echo "IMAGE_TAG=develop-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configure Gradle for GitHub Packages
        run: |
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/gradle.properties
          gpr.user=${{ github.actor }}
          gpr.token=${{ secrets.COMMON_TOKEN_GITHUB }}
          EOF

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew clean bootJar --no-daemon


      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & Push Docker image
        run: |
          docker build -t $IMAGE_NAME:${IMAGE_TAG} .
          docker push $IMAGE_NAME:${IMAGE_TAG}

      # update GitOps
      - name: Install kustomize
        run: |
          curl -s https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: KTEventee/eventee-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update member image tag in GitOps
        run: |
          cd gitops/dev/member
          kustomize edit set image REPLACE_IMAGE_MEMBER=$IMAGE_NAME:${IMAGE_TAG}

      - name: Commit & push GitOps change
        run: |
          cd gitops
          git config user.name "eventee-develop-ci"
          git config user.email "ci@eventee.cloud"
          git commit -am "(chore/dev): deploy member ${IMAGE_TAG}"
          git push origin main

