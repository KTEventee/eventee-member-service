name: Build & Push Docker Image (develop)

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 공통 모듈 접근 설정
      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.COMMON_TOKEN_GITHUB }}</password>
              </server>
            </servers>
          </settings>
          EOF


      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew clean bootJar --no-daemon


      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin


      - name: Build Docker Image
        run: |
          IMAGE_NAME=ghcr.io/ktEventee/${{ github.event.repository.name }}
          COMMIT_SHA=${{ github.sha }}

          echo "Building image: $IMAGE_NAME"
          docker build \
            -t $IMAGE_NAME:develop-$COMMIT_SHA \
            -t $IMAGE_NAME:develop-latest \
            .

      - name: Push Docker Image
        run: |
          IMAGE_NAME=ghcr.io/ktEventee/${{ github.event.repository.name }}
          COMMIT_SHA=${{ github.sha }}

          docker push $IMAGE_NAME:develop-$COMMIT_SHA
          docker push $IMAGE_NAME:develop-latest

      - name: Output built image info
        run: |
          echo "Image pushed: ghcr.io/ktEventee/${{ github.event.repository.name }}:develop-${{ github.sha }}"
          echo "Latest tag: develop-latest"
